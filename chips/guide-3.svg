<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 314" width="860" height="314" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif"><title>LEARNING field guide</title><rect x="1" y="1" width="858" height="312" rx="14" fill="#9986D4" fill-opacity="0.05" stroke="#9986D4" stroke-opacity="0.4" stroke-width="1.2"/><g transform="translate(30,24)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/><circle cx="0" cy="-6.5" r="3.4" fill="#7361BE"/><circle cx="6.2" cy="-2" r="3.4" fill="#7361BE"/><circle cx="3.8" cy="5.3" r="3.4" fill="#7361BE"/><circle cx="-3.8" cy="5.3" r="3.4" fill="#7361BE"/><circle cx="-6.2" cy="-2" r="3.4" fill="#7361BE"/></g><circle r="2.8" fill="#7361BE"/></g><text x="48" y="28" font-size="11" letter-spacing="1.5" fill="#8b949e">LEARNING</text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.5s" fill="freeze"/><rect x="28" y="53" width="32" height="32" rx="9" fill="#E2542F" fill-opacity="0.12"/><text x="44" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#E2542F">T</text><text x="74" y="65" font-size="14" font-weight="700" fill="#E2542F">Transformer</text><text x="74" y="83" font-size="12" fill="#8b949e">Attention-based language modeling built from tokenizer inputs through causal decoder</text><text x="74" y="98" font-size="12" fill="#8b949e">layers.</text><path d="M74 94H828" stroke="#E2542F" stroke-opacity="0.18" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.23s" dur="0.5s" fill="freeze"/><rect x="28" y="107" width="32" height="32" rx="9" fill="#F4795B" fill-opacity="0.12"/><text x="44" y="129" text-anchor="middle" font-size="15" font-weight="700" fill="#F4795B">B</text><text x="74" y="119" font-size="14" font-weight="700" fill="#F4795B">BPE</text><text x="74" y="137" font-size="12" fill="#8b949e">Byte-pair encoding with streaming merges, word-level caching, and reproducible</text><text x="74" y="152" font-size="12" fill="#8b949e">vocabulary training.</text><path d="M74 148H828" stroke="#F4795B" stroke-opacity="0.18" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.31s" dur="0.5s" fill="freeze"/><rect x="28" y="161" width="32" height="32" rx="9" fill="#ED8B66" fill-opacity="0.12"/><text x="44" y="183" text-anchor="middle" font-size="15" font-weight="700" fill="#ED8B66">R</text><text x="74" y="173" font-size="14" font-weight="700" fill="#ED8B66">RoPE</text><text x="74" y="191" font-size="12" fill="#8b949e">Rotary position embeddings that encode relative position inside multi-head attention.</text><path d="M74 202H828" stroke="#ED8B66" stroke-opacity="0.18" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.39s" dur="0.5s" fill="freeze"/><rect x="28" y="215" width="32" height="32" rx="9" fill="#7FA36B" fill-opacity="0.12"/><text x="44" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#7FA36B">S</text><text x="74" y="227" font-size="14" font-weight="700" fill="#7FA36B">SwiGLU</text><text x="74" y="245" font-size="12" fill="#8b949e">Gated activation blocks that improve transformer feed-forward expressiveness.</text><path d="M74 256H828" stroke="#7FA36B" stroke-opacity="0.18" stroke-width="1"/></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.47s" dur="0.5s" fill="freeze"/><rect x="28" y="269" width="32" height="32" rx="9" fill="#E2542F" fill-opacity="0.12"/><text x="44" y="291" text-anchor="middle" font-size="15" font-weight="700" fill="#E2542F">A</text><text x="74" y="281" font-size="14" font-weight="700" fill="#E2542F">AdamW</text><text x="74" y="299" font-size="12" fill="#8b949e">Adaptive optimization with decoupled weight decay, warmup, and cosine learning-rate</text><text x="74" y="314" font-size="12" fill="#8b949e">schedules.</text></g></svg>
